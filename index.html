<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KINEKO REBORN | Video Loop Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 共通の隠しビデオ要素（Canvas描画用、デコード負荷を1本分に抑える） -->
    <video id="shared-video" loop muted playsinline style="display: none;"></video>

    <div id="title-screen" class="title-screen">
        <h1 class="main-title">KINEKO REBORN</h1>
        <p class="subtitle">Video Loop Puzzle</p>
        <div class="mode-container">
            <div class="mode-section">
                <h2 class="mode-title">通常モード</h2>
                <div class="difficulty-select">
                    <button class="btn diff-btn" id="btn-easy">イージー (3x3)</button>
                    <button class="btn diff-btn" id="btn-normal">ノーマル (4x4)</button>
                    <button class="btn diff-btn" id="btn-hard">ハード (5x5)</button>
                </div>
            </div>
            <div class="mode-section hell-section">
                <h2 class="mode-title hell-title">ヘルモード 💀</h2>
                <div class="difficulty-select">
                    <button class="btn diff-btn btn-hell" id="btn-easy-hell">イージー (3x3)</button>
                    <button class="btn diff-btn btn-hell" id="btn-normal-hell">ノーマル (4x4)</button>
                    <button class="btn diff-btn btn-hell" id="btn-hard-hell">ハード (5x5)</button>
                </div>
            </div>
        </div>
    </div>

    <div id="app" style="display: none;">
        <div class="game-main-area">
            <main class="puzzle-container">
                <div id="puzzle-board"></div>
                <video id="completed-video" loop muted playsinline class="completed-video" style="display: none;"></video>
                <div id="result-overlay" class="overlay">Stage Clear</div>
            </main>
        </div>

        <footer class="controls">
            <div id="stage-title" class="stage-title">Stage 1: Loading...</div>
            <div id="game-timer" class="game-timer">00:00</div>
            
            <!-- ヘルモード用の反転トグルボタン -->
            <div id="flip-controls" class="flip-controls" style="display: none;">
                <button id="btn-flip-h" class="btn btn-flip">⇔ 左右</button>
                <button id="btn-flip-v" class="btn btn-flip">⇕ 上下</button>
            </div>
            
            <button id="next-btn" class="btn">スキップ</button>
            <button id="reload-btn" class="btn">リロード</button>
            <button id="preview-btn" class="btn btn-preview">完成図</button>
            <button id="back-to-title-btn" class="btn btn-back-title">タイトルへ</button>
        </footer>

        <!-- 完成図モーダル -->
        <div id="preview-modal" class="preview-modal" style="display:none;">
            <div class="preview-inner">
                <button id="preview-close" class="preview-close-btn">&times;</button>
                <p class="preview-label">完成図</p>
                <video id="preview-video" autoplay loop muted playsinline class="preview-video"></video>
            </div>
        </div>

        <!-- タイムアップ（時間切れ）モーダル -->
        <div id="timeup-modal" class="timeup-modal" style="display:none;">
            <div class="timeup-inner">
                <h2 class="timeup-title">TIME UP</h2>
                <p class="timeup-text">制限時間内にクリアできませんでした。</p>
                <div class="timeup-buttons">
                    <button id="ad-btn" class="btn btn-ad">広告を見て +1分延長 📺</button>
                    <button id="retry-stage-btn" class="btn btn-retry">再挑戦</button>
                </div>
            </div>
        </div>

        <!-- 疑似広告再生用モーダル -->
        <div id="ad-modal" class="ad-modal" style="display:none;">
            <div class="ad-inner">
                <p class="ad-status">広告を再生中...</p>
                <div class="ad-progress-container">
                    <div id="ad-progress-bar" class="ad-progress-bar"></div>
                </div>
                <p class="ad-tip">あと <span id="ad-countdown">3</span> 秒で終了します</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
